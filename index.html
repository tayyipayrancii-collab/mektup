<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz Zarf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="envelope-wrapper" id="envelopeWrapper">
            <div class="envelope">
                <div class="front flap"></div>
                <div class="front pocket"></div>
                
                <div class="letter">
                    <button class="nav-btn prev-btn" onclick="changeImage(-1, event)">&#10094;</button>

                    <img src="gorsel1.jpg" alt="Sürpriz Görsel 1" id="surprise-image">

                    <button class="nav-btn next-btn" onclick="changeImage(1, event)">&#10095;</button>
                </div>
            </div>
            <p class="instruction">Açmak için zarfa tıkla!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
